name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install pytest pytest-html ruff mypy bandit
      - name: Run tests
        run: |
          cd backend
          PYTHONPATH=. pytest tests/test_prediction_engine.py tests/test_strategy_pipeline.py tests/test_scheduler_jobs.py -v --tb=short --html=report.html
        continue-on-error: true
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.python }}
          path: backend/report.html

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: |
          cd backend
          ruff check . --statistics
        continue-on-error: true

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy on core modules
        run: |
          cd backend
          mypy core/models/*.py core/constants.py core/context.py --ignore-missing-imports --no-error-summary
        continue-on-error: true

  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: |
          cd backend
          bandit -r core/ features/ fusion/ strategy/ -ll -ii --skip B104,B311 -f json -o bandit-report.json
        continue-on-error: true
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: backend/bandit-report.json
