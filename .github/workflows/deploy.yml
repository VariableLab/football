name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-at-least-32-characters-long-for-pytest' }}
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY || 'test-admin-key-long-enough' }}
          DATABASE_URL: sqlite:///./backend/database.sqlite
        run: |
          pytest backend/tests


  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            # 强制重置以防本地修改冲突 (生产环境最佳实践)
            git fetch origin master
            git reset --hard origin/master
            
            # 更新后端依赖 (💡 显式安装 pandas 以防 requirements 遗漏)
            cd backend
            ./venv/bin/pip install -r requirements.txt -q
            ./venv/bin/pip install pandas sqlalchemy pyyaml -q
            
            # 针对 ARM 架构注入补丁
            ./venv/bin/python3 -c "from utils.scraper_patch import patch_soccerdata; patch_soccerdata()"
            
            # 强制清场：杀死所有占用 8000 端口的僵尸进程 (💡 解决 Address already in use)
            echo "🧹 Clearing port 8000..."
            sudo fuser -k 8000/tcp || true
            
            # 重启系统服务
            echo "🚀 Restarting API services..."
            sudo systemctl daemon-reload
            sudo systemctl restart football-api
            
            # 💡 强力重刷：执行数据清洗和预测重算脚本 (现在脚本会自加载 .env)
            echo "🌱 Running server-side data healing..."
            ./venv/bin/python3 scripts/server_refresh.py
            
            # 最终健康检查
            echo "📊 Verifying service status..."
            sleep 5
            if ! sudo systemctl is-active football-api; then
                echo "❌ Service failed! Logs:"
                sudo journalctl -u football-api -n 50 --no-pager
                exit 1
            fi
            echo "✅ Service is running."
