name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-at-least-32-characters-long-for-pytest' }}
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY || 'test-admin-key-long-enough' }}
          DATABASE_URL: sqlite:///./backend/database.sqlite
        run: |
          pytest backend/tests


  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            # 1. 物理重置環境
            echo "🧹 Hard resetting..."
            git fetch --all
            git reset --hard origin/master
            
            # 2. 徹底殺死所有競爭對手 (解決 Address already in use)
            echo "🛑 Emergency stopping all API services..."
            sudo systemctl stop football-api || true
            sudo systemctl stop wc-analytics || true
            sudo systemctl disable wc-analytics || true
            sudo fuser -k 8000/tcp || true
            sudo pkill -9 -f uvicorn || true
            sleep 3
            
            # 3. 確保依賴完整
            cd backend
            ./venv/bin/pip install -r requirements.txt -q
            
            # 4. 數據已經在上一輪刷好 (149/149)，此處跳過以節省內存
            # ./venv/bin/python3 scripts/server_refresh.py
            
            # 5. 重啟唯一的服務
            echo "🚀 Starting clean API service..."
            sudo systemctl daemon-reload
            sudo systemctl start football-api
            
            # 6. 最終健康檢查 (15s 延時)
            echo "📊 Verifying service status..."
            sleep 15
            sudo systemctl status football-api --no-pager
            if ! sudo systemctl is-active football-api; then
                echo "❌ Service failed. Check port 8000 owner:"
                sudo lsof -i :8000 || echo "Port 8000 is free"
                exit 1
            fi
            echo "✅ Service is running successfully."
