name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        env:
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-at-least-32-characters-long' }}
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY || 'test-admin-key-long-enough' }}
          DATABASE_URL: sqlite:///./backend/database.sqlite
        run: |
          pytest backend/tests

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            # 强制重置以防本地修改冲突 (生产环境最佳实践)
            git fetch origin master
            git reset --hard origin/master
            
            # 更新后端依赖
            cd backend
            ./venv/bin/pip install -r requirements.txt -q
            
            # 针对 ARM 架构注入补丁 (确保远程环境 Scraper 正常)
            ./venv/bin/python3 -c "from utils.scraper_patch import patch_soccerdata; patch_soccerdata()"
            
            # 重启系统服务
            echo "🚀 Restarting V5 API and Agent services..."
            sudo systemctl restart football-api
            sudo systemctl restart football-agent
            
            # 最终健康检查
            echo "📊 Verifying service status..."
            sudo systemctl is-active football-api
            sudo systemctl is-active football-agent
