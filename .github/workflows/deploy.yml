name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-at-least-32-characters-long-for-pytest' }}
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY || 'test-admin-key-long-enough' }}
          DATABASE_URL: sqlite:///./backend/database.sqlite
        run: |
          pytest backend/tests


  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            # 1. 物理重置環境
            echo "🧹 Hard resetting repository..."
            git fetch --all
            git reset --hard origin/master
            find . -name "*.pyc" -delete
            find . -name "__pycache__" -delete
            
            # 2. 物理停服清場 (解決死循環與端口占用)
            echo "🛑 Cleaning up port 8000..."
            sudo systemctl stop football-api || true
            # 精確殺死佔用 8000 端口的進程，且不影響 SSH
            sudo fuser -k 8000/tcp || true
            sleep 1
            
            # 3. 輕量化更新依賴 (移除 pandas 等重型安裝，假設環境已具備)
            cd backend
            ./venv/bin/pip install -r requirements.txt -q
            
            # 4. 執行數據修復
            echo "🌱 Running server-side data healing..."
            ./venv/bin/python3 scripts/server_refresh.py || echo "⚠️ Refresh script warning, continuing..."
            
            # 5. 重啟服務
            echo "🚀 Starting API service..."
            sudo systemctl daemon-reload
            sudo systemctl start football-api
            
            # 6. 最終健康檢查 (延長至 15s)
            echo "📊 Verifying service status..."
            sleep 15
            if ! sudo systemctl is-active football-api; then
                echo "❌ Service failed to start! Last 100 logs:"
                sudo journalctl -u football-api -n 100 --no-pager
                exit 1
            fi
            echo "✅ Service is running successfully."
