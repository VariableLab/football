name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-at-least-32-characters-long-for-pytest' }}
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY || 'test-admin-key-long-enough' }}
          DATABASE_URL: sqlite:///./backend/database.sqlite
        run: |
          pytest backend/tests


  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            # 1. 物理重置環境
            echo "🧹 Resetting code..."
            git fetch --all
            git reset --hard origin/master

            # 2. 徹底殺死舊進程 (解決 Address already in use)
            echo "🛑 Killing old processes..."
            sudo systemctl stop football-api || true
            # 使用 kill -9 強力清除，不使用沉重的 fuser
            sudo lsof -t -i:8000 | xargs sudo kill -9 || true
            sleep 2

            # 3. 重啟服務
            echo "🚀 Starting service..."
            sudo systemctl daemon-reload
            sudo systemctl start football-api

            # 4. 健康檢查
            echo "📊 Verifying..."
            sleep 10
            sudo systemctl is-active football-api
            echo "✅ Deployment finished."

