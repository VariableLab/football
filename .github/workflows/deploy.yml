name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-at-least-32-characters-long-for-pytest' }}
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY || 'test-admin-key-long-enough' }}
          DATABASE_URL: sqlite:///./backend/database.sqlite
        run: |
          pytest backend/tests


  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            # 1. 物理重置環境
            echo "🧹 Hard resetting repository..."
            git fetch --all
            git reset --hard origin/master
            find . -name "*.pyc" -delete
            find . -name "__pycache__" -delete
            
            # 2. 物理停服清場 (解決死循環與端口占用)
            echo "🛑 Killing old API processes..."
            sudo systemctl stop football-api || true
            sudo fuser -k 8000/tcp || true
            sudo pkill -9 -f uvicorn || true
            sleep 2
            
            # 3. 更新依賴 (確保 pandas 可用)
            cd backend
            ./venv/bin/pip install -r requirements.txt -q
            ./venv/bin/pip install pandas sqlalchemy pyyaml python-dotenv -q
            
            # 4. 執行數據修復 (此時服務已停，無數據競爭)
            echo "🌱 Running server-side data healing..."
            ./venv/bin/python3 scripts/server_refresh.py
            
            # 5. 重啟服務
            echo "🚀 Starting API service..."
            sudo systemctl daemon-reload
            sudo systemctl start football-api
            
            # 6. 最終健康檢查 (延時 10s 以待異步啟動完成)
            echo "📊 Verifying service status..."
            sleep 10
            if ! sudo systemctl is-active football-api; then
                echo "❌ Service failed to start! Last 100 logs:"
                sudo journalctl -u football-api -n 100 --no-pager
                exit 1
            fi
            echo "✅ Service is running successfully."
