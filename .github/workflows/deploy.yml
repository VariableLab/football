name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-at-least-32-characters-long-for-pytest' }}
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY || 'test-admin-key-long-enough' }}
          DATABASE_URL: sqlite:///./backend/database.sqlite
        run: |
          pytest backend/tests


  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            # 1. 物理清場
            echo "🛑 Killing all python processes..."
            sudo systemctl stop football || true
            sudo pkill -9 python3 || true
            sudo pkill -9 uvicorn || true
            sudo fuser -k 8000/tcp || true
            sleep 2
            
            # 2. 強制更新代碼
            echo "🧹 Force resetting code..."
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            git fetch --all
            git reset --hard origin/master
            find . -name "__pycache__" -exec rm -rf {} + || true
            
            # 3. 執行數據重算 (此時無進程競爭)
            echo "🌱 Recalculating with NEW logic..."
            cd backend
            export PYTHONPATH=$PYTHONPATH:$(pwd)
            ./venv/bin/python3 scripts/server_refresh.py
            
            # 4. 啟動服務
            echo "🚀 Starting fresh service..."
            sudo systemctl daemon-reload
            sudo systemctl start football
            
            # 5. 最終校驗
            echo "📊 Verifying version and port..."
            sleep 10
            if ! curl -s http://localhost:8000/api/health | grep "0.3.0"; then
                echo "❌ CRITICAL: Server is still running OLD code!"
                sudo systemctl status football --no-pager
                exit 1
            fi
            echo "✅ Deployment Success! Logic and Data are now correctly updated."


