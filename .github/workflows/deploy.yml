name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        env:
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-at-least-32-characters-long' }}
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY || 'test-admin-key-long-enough' }}
          DATABASE_URL: sqlite:///./backend/database.sqlite
        run: |
          pytest backend/tests

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/Github/football
            # 强制重置以防本地修改冲突 (生产环境最佳实践)
            git fetch origin master
            git reset --hard origin/master
            
            # 更新后端依赖 (💡 显式安装 pandas 以防 requirements 遗漏)
            cd backend
            ./venv/bin/pip install -r requirements.txt -q
            ./venv/bin/pip install pandas sqlalchemy pyyaml -q
            
            # 针对 ARM 架构注入补丁
            ./venv/bin/python3 -c "from utils.scraper_patch import patch_soccerdata; patch_soccerdata()"
            
            # 重启系统服务
            echo "🚀 Restarting WC Analytics services..."
            sudo systemctl daemon-reload
            sudo systemctl restart wc-analytics
            
            # 💡 强力重刷：强制执行一次数据清洗和预测重算
            export PYTHONPATH=$PYTHONPATH:$(pwd)
            ./venv/bin/python3 -c "
from database.models import SessionLocal
from ingestion.data_cleaner import DataCleaner
from core.prediction_engine import PredictionEngine, build_context_from_match
from database.models import Match, Prediction, MatchStatus
db = SessionLocal()
print('Cleaning teams...')
DataCleaner(db).clean(dry_run=False)
print('Recalculating predictions...')
engine = PredictionEngine(db_session=db)
matches = db.query(Match).filter(Match.status != MatchStatus.FINISHED).all()
for m in matches:
    db.query(Prediction).filter(Prediction.match_id == m.id).delete()
    try:
        res = engine.predict(build_context_from_match(m))
        for p in res.to_db_payload():
            db.add(Prediction(match_id=m.id, play_type=p['play_type'], probabilities=p['probabilities'], confidence=res.confidence))
    except: continue
db.commit()
print('Server recap finished.')"
            
            # 最终健康检查 (增加延迟)
            echo "📊 Verifying service status..."
            sleep 5
            if ! sudo systemctl is-active wc-analytics; then
                echo "❌ Service failed to start! Printing logs:"
                sudo journalctl -u wc-analytics -n 50 --no-pager
                exit 1
            fi
            echo "✅ Service is running."
