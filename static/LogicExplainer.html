<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>WC Analytics 核心逻辑推演看板</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Newsreader:italic,wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F9F8F3;
      --ink: #1A1A1A;
      --accent: #C04A1A;
    }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    .font-serif { font-family: 'Newsreader', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    .paper-texture {
      position: fixed;
      inset: 0;
      background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
      opacity: 0.3;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes flow-particle {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(400px); opacity: 0; }
    }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      animation: flow-particle 3s linear infinite;
    }

    .grid-bg {
      background-image: radial-gradient(var(--ink) 0.5px, transparent 0.5px);
      background-size: 20px 20px;
      opacity: 0.05;
    }

    .step-card {
      background: white;
      border: 1px solid rgba(0,0,0,0.05);
      transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
    }
    .step-card.active {
      border-color: var(--accent);
      box-shadow: 0 20px 50px rgba(192, 74, 26, 0.1);
    }
    .stamp {
      border: 4px solid var(--accent);
      color: var(--accent);
      padding: 10px 20px;
      font-weight: 900;
      transform: rotate(-15deg);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="paper-texture"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── 核心动效：量化流水线 ───
    const QuantPipeline = ({ phase }) => {
      return (
        <div className="relative w-full h-full flex flex-col items-center">
          <div className="absolute inset-0 grid-bg"></div>
          
          <div className="relative z-10 w-full flex flex-col items-center gap-12 mt-10">
            
            {/* 1. Raw Data Input */}
            <div className={`w-40 h-24 border-2 border-ink/10 flex flex-col items-center justify-center p-4 transition-all duration-700 ${phase >= 0 ? 'bg-white' : 'opacity-10'}`}>
              <div className="text-[8px] font-black text-ink-faded uppercase tracking-widest mb-2">SAMPLE_DATA_INPUT</div>
              <div className="flex gap-1 overflow-hidden h-4 items-end">
                {[1,2,3,4,5].map(i => (
                  <div key={i} className={`w-1.5 bg-ink/20 animate-pulse`} style={{height: `${Math.random()*100}%`, animationDelay: `${i*0.2}s`}}></div>
                ))}
              </div>
            </div>

            {/* 流动箭头 1 */}
            <div className="h-12 w-px bg-ink/10 relative">
               {phase >= 0 && <div className="particle" style={{left: '-2px'}}></div>}
            </div>

            {/* 2. Formula / Matrix Processor */}
            <div className={`w-56 h-32 paper-sheet flex flex-col items-center justify-center p-6 relative transition-all duration-700 ${phase >= 1 ? 'border-accent border-2' : 'opacity-10'}`}>
               <div className="absolute -top-3 left-4 bg-paper px-2 text-[9px] font-black">48-FEATURE_SCANNER</div>
               <div className="font-mono text-[10px] leading-tight text-center">
                 {phase >= 1 ? (
                   <div className="animate-fade-in">
                     <div className="text-accent">Σ(ω_i * x_i) + b</div>
                     <div className="text-ink/40 mt-1">StackingNet v4.5 Active</div>
                   </div>
                 ) : 'AWAITING_VECTOR'}
               </div>
            </div>

            {/* 流动箭头 2 */}
            <div className="h-12 w-px bg-ink/10 relative">
               {phase >= 1 && <div className="particle" style={{left: '-2px'}}></div>}
            </div>

            {/* 3. Market Calibrator (对冲天平) */}
            <div className={`w-64 h-32 border-2 border-ink/5 flex items-center justify-around transition-all duration-700 ${phase >= 2 ? 'bg-white' : 'opacity-10'}`}>
               <div className="flex flex-col items-center gap-2">
                 <div className="text-[7px] font-black opacity-40">MARKET SNAPSHOT</div>
                 <div className="w-8 h-12 bg-ink/10 rounded-sm overflow-hidden flex items-end">
                   <div className="w-full bg-ink/20" style={{height: '60%'}}></div>
                 </div>
               </div>
               
               <div className="text-xl font-serif italic text-accent">vs</div>

               <div className="flex flex-col items-center gap-2">
                 <div className="text-[7px] font-black text-accent">MODEL ESTIMATE</div>
                 <div className="w-8 h-12 bg-accent/10 rounded-sm overflow-hidden flex items-end">
                   <div className={`w-full bg-accent transition-all duration-1000`} style={{height: phase >= 2 ? '85%' : '0%'}}></div>
                 </div>
               </div>
            </div>

            {/* 流动箭头 3 */}
            <div className="h-12 w-px bg-ink/10 relative">
               {phase >= 2 && <div className="particle" style={{left: '-2px'}}></div>}
            </div>

            {/* 4. Final Verdict Seal */}
            <div className={`w-40 h-24 flex items-center justify-center transition-all duration-1000 ${phase >= 3 ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>
               <div className="stamp text-2xl">CALIBRATED</div>
            </div>

          </div>

          <div className="mt-20 w-full grid grid-cols-2 gap-4">
             <div className="p-4 bg-ink/5 rounded-sm">
                <div className="text-[8px] font-black opacity-30 uppercase mb-1">Inference Power</div>
                <div className="text-xs font-mono">1.2 TFLOPS</div>
             </div>
             <div className="p-4 bg-ink/5 rounded-sm">
                <div className="text-[8px] font-black opacity-30 uppercase mb-1">Calibration Drift</div>
                <div className="text-xs font-mono text-accent" x-text="phase >= 2 ? 'STABLE' : 'SCANNING'">{phase >= 2 ? 'STABLE' : 'SCANNING'}</div>
             </div>
          </div>
        </div>
      );
    };

    const LogicStep = ({ id, title, description, active, completed }) => (
      <div className={`relative pl-12 mb-20 transition-all duration-700 ${active ? 'opacity-100' : 'opacity-20'}`}>
        <div className={`absolute left-0 top-1 w-3 h-3 rounded-full ${active ? 'bg-accent' : completed ? 'bg-ink' : 'bg-ink/10'}`}></div>
        <div className="absolute top-6 bottom-[-60px] left-[5.5px] w-px bg-ink/10"></div>
        
        <div className={`p-8 rounded-sm ${active ? 'bg-white border border-ink/5 shadow-xl' : ''}`}>
          <span className="text-[10px] font-black text-accent uppercase tracking-widest block mb-4">Step 0{id}</span>
          <h3 className="text-2xl font-serif italic mb-4">{title}</h3>
          <p className="text-sm leading-relaxed text-ink/70 font-serif italic">{description}</p>
        </div>
      </div>
    );

    const App = () => {
      const [currentStep, setCurrentStep] = useState(0);
      const steps = [
        {
          title: "样本数据采集",
          description: "同步全球 200+ 级联赛数据源，抓取 Elo 战力、历史对阵等 3.1 万场赛事底稿。"
        },
        {
          title: "多维特征特征建模",
          description: "利用 StackingNet 4.5 神经网络，对进攻转化率、防守抗压等 48 个动态变量进行交叉校准运算。"
        },
        {
          title: "概率校准与偏差分析",
          description: "计算模型测算的概率估值。当模型估值偏离市场快照时，生成客观的模型偏差分析。"
        },
        {
          title: "校准报告输出",
          description: "由 AI 将数学数据转化为可复现的研究报告，输出最终校准概率。"
        }
      ];

      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentStep(prev => (prev + 1) % steps.length);
        }, 5000);
        return () => clearInterval(timer);
      }, []);

      return (
        <div className="min-h-screen py-24 px-8">
          <div className="max-w-6xl mx-auto">
            <header className="mb-32">
              <h1 className="text-6xl sm:text-8xl font-serif hero-text tracking-tighter mb-8" style={{color: 'var(--ink)'}}>How it works.</h1>
              <p className="text-lg text-ink/60 font-serif italic max-w-xl">
                这不是结果预测，这是一场基于数学概率的数据校准。
              </p>
            </header>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-20">
              <div className="md:col-span-6">
                {steps.map((step, idx) => (
                  <LogicStep 
                    key={idx}
                    id={idx + 1}
                    title={step.title}
                    description={step.description}
                    active={currentStep === idx}
                    completed={currentStep > idx}
                  />
                ))}
              </div>

              <div className="md:col-span-6 relative">
                <div className="sticky top-24 border border-ink/5 rounded-sm bg-[#EBEAE4]/40 p-12 overflow-hidden shadow-inner h-[800px]">
                  <div className="text-[9px] font-black tracking-[0.3em] text-ink/40 uppercase mb-10 text-center">Inference Pipeline Stream</div>
                  <QuantPipeline phase={currentStep} />
                </div>
              </div>
            </div>
            
            <div className="mt-40 text-center">
               <a href="/static/index.html" className="text-xs font-black uppercase tracking-widest text-accent border-b-2 border-accent pb-2 hover:text-ink hover:border-ink transition-all">返回研究终端</a>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
