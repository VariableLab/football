<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC Analytics V5 — Data Narrative Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=JetBrains+Mono:wght@100..800&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --paper: #F9F7F2;
            --ink: #1A1A1A;
            --accent: #C04A1A; /* 铁锈红，体现深度研究感 */
            --glass: rgba(255, 255, 255, 0.7);
        }
        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden; /* 终端布局 */
        }
        .serif { font-family: 'Newsreader', serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        /* 动画 */
        .fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-row:hover { background: rgba(0,0,0,0.02); }
        .match-row.active { background: white; border-right: 4px solid var(--accent); }

        .edge-positive { color: #2D5A27; background: #E8F5E9; }
        .edge-negative { color: #A62626; background: #FFEBEE; }

        /* 纸张纹理叠加 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            opacity: 0.04;
            pointer-events: none;
            z-index: 100;
        }

        .stamp {
            border: 4px solid var(--ink);
            padding: 1rem 2rem;
            transform: rotate(-2deg);
            display: inline-block;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Mock Data (用于展示 V5 逻辑) ---
        const MOCK_MATCHES = [
            { 
                id: 1, home: "阿根廷", away: "比利时", league: "世界杯 1/4 决赛", time: "20:00", 
                edge: 0.125, status: "stable", xg_h: 2.1, xg_a: 1.8, 
                headline: "实力版图的微妙倾斜",
                insight: "在 2026 世界杯的博弈框架下，阿根廷展现出了极强的 xG 压制力，然而市场赔率并未完全消化这一物理优势。模型测得阿根廷在过去 5 场比赛中的 SCA (射门创造行为) 远超平均值。",
                star: { name: "Lionel Messi", xg: 0.82, sfc: 5.4, impact: "+12.4%" },
                verdict: "Strong Buy"
            },
            { 
                id: 2, home: "博卡", away: "天主大学", league: "南美解放者杯", time: "07:30", 
                edge: 0.012, status: "modeling", xg_h: 0, xg_a: 0,
                headline: "战术特征的冷启动重构",
                insight: "系统目前正在对该场比赛进行冷启动重构。由于当前联赛历史数据较少，模型目前主要基于市场赔率偏离值进行实时研判。预计 15 分钟后完成特征对齐。",
                verdict: "Neutral"
            },
            { 
                id: 3, home: "英格兰", away: "法国", league: "世界杯 1/4 决赛", time: "02:00", 
                edge: -0.084, status: "stable", xg_h: 1.9, xg_a: 2.4, 
                headline: "高维特征下的防御溢价",
                insight: "法国队在进攻转换阶段的效率极高。英格兰虽有控球优势，但在 59 维残差模型中，其在高位逼抢下的丢球风险被显著低估。市场目前对英格兰过度乐观。",
                star: { name: "Kylian Mbappé", xg: 0.94, sfc: 6.2, impact: "+15.8%" },
                verdict: "Underpriced"
            },
            { 
                id: 4, home: "新加坡", away: "中国", league: "世预赛", time: "19:00", 
                edge: 0.152, status: "stable", xg_h: 0.8, xg_a: 2.1, 
                headline: "亚洲赛区的物理性压制",
                insight: "中国队在身材高度与对抗成功率上具有显著优势。xG 模型显示新加坡在防守高空球时存在系统性缺陷。这是一个典型的高置信度 Edge 场次。",
                star: { name: "武磊", xg: 0.65, sfc: 3.1, impact: "+8.2%" },
                verdict: "Strong Buy"
            },
        ];

        const App = () => {
            const [selectedId, setSelectedId] = useState(1);
            const activeMatch = MOCK_MATCHES.find(m => m.id === selectedId);

            return (
                <div className="flex h-screen w-full overflow-hidden">
                    {/* --- Sidebar: Signal Explorer --- */}
                    <div className="w-[380px] h-full border-r border-black/5 flex flex-col bg-[#F4F1EA]">
                        <div className="p-8 border-b border-black/5">
                            <div className="text-2xl font-serif italic font-black tracking-tighter mb-1 text-ink">f.</div>
                            <div className="text-[10px] font-black uppercase tracking-[0.2em] text-ink/40">WC Analytics · Vol. 5.0</div>
                        </div>

                        <div className="flex-1 overflow-y-auto">
                            <div className="px-8 py-6 text-[10px] font-black uppercase tracking-widest text-ink/30 border-b border-black/5 flex justify-between">
                                <span>Signal Stream</span>
                                <span className="text-accent animate-pulse">● LIVE</span>
                            </div>
                            {MOCK_MATCHES.map(m => (
                                <div 
                                    key={m.id}
                                    onClick={() => setSelectedId(m.id)}
                                    className={`match-row cursor-pointer transition-all duration-300 border-b border-black/5 p-6 flex flex-col gap-3 ${selectedId === m.id ? 'active shadow-sm' : ''}`}
                                >
                                    <div className="flex justify-between items-center">
                                        <span className="text-[9px] font-bold text-accent uppercase tracking-widest">{m.league}</span>
                                        <span className="mono text-[10px] opacity-40">{m.time}</span>
                                    </div>
                                    <div className="flex justify-between items-end">
                                        <div className="text-base font-black text-ink">{m.home} <span className="opacity-20 mx-1">/</span> {m.away}</div>
                                        <div className={`px-2 py-0.5 rounded-sm mono text-[10px] font-bold ${m.edge > 0.1 ? 'edge-positive' : m.edge < -0.05 ? 'edge-negative' : 'bg-black/5 text-ink/40'}`}>
                                            {m.edge > 0 ? '+' : ''}{(m.edge * 100).toFixed(1)}%
                                        </div>
                                    </div>
                                    {m.status === 'modeling' && (
                                        <div className="mt-1">
                                            <div className="w-full h-1 bg-black/5 rounded-full overflow-hidden">
                                                <div className="h-full bg-accent/40 w-1/3 animate-pulse"></div>
                                            </div>
                                            <span className="text-[8px] font-bold text-accent/60 uppercase mt-1 inline-block">Deep Modeling...</span>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        {/* Agent Thinking Stream */}
                        <div className="p-8 bg-black text-white">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-2 h-2 rounded-full bg-accent animate-pulse"></div>
                                <span className="text-[10px] font-black uppercase tracking-widest opacity-60">Agent thinking stream</span>
                            </div>
                            <div className="mono text-[10px] leading-relaxed opacity-80 h-12 overflow-hidden">
                                <span className="text-accent">></span> 正在拉取 {activeMatch.home} 过去 24 小时的 Steam Move 异动数据...<br/>
                                <span className="text-accent">></span> 对齐 59 维特征向量，残差修正神经网络已就绪。
                            </div>
                        </div>
                    </div>

                    {/* --- Main Content: The Narrative Gallery --- */}
                    <div className="flex-1 h-full overflow-y-auto bg-white relative">
                        {activeMatch ? (
                            <div className="max-w-4xl mx-auto p-12 lg:p-24 space-y-20 fade-in-up" key={activeMatch.id}>
                                
                                {/* 1. The Opening Narrative */}
                                <div className="space-y-8">
                                    <div className="flex items-center gap-4">
                                        <div className="h-px flex-1 bg-black/5"></div>
                                        <span className="mono text-[10px] tracking-widest opacity-30">RESEARCH ARCHIVE #{activeMatch.id}</span>
                                        <div className="h-px flex-1 bg-black/5"></div>
                                    </div>
                                    <h1 className="text-6xl serif italic font-light leading-tight text-ink">
                                        {activeMatch.headline}
                                    </h1>
                                    <div className="text-2xl leading-relaxed serif text-ink/70 italic border-l-4 border-accent pl-10 py-4 bg-accent/5">
                                        {activeMatch.insight}
                                    </div>
                                </div>

                                {/* 2. Infographic: xG Contrast */}
                                <div className="grid grid-cols-2 gap-20 py-16 border-y border-black/5">
                                    <div className="space-y-8">
                                        <div className="text-[10px] font-black uppercase tracking-widest text-ink/40">Expected Goals Analysis (xG)</div>
                                        <div className="flex items-end gap-3 h-48">
                                            <div className="flex-1 bg-accent/10 relative transition-all group hover:bg-accent/20" style={{height: activeMatch.xg_h ? `${activeMatch.xg_h * 40}%` : '4px'}}>
                                                <span className="absolute -top-10 left-0 mono text-2xl font-bold">{activeMatch.xg_h || '—'}</span>
                                                <div className="absolute bottom-[-32px] left-0 text-[10px] font-black uppercase tracking-wider">{activeMatch.home}</div>
                                            </div>
                                            <div className="flex-1 bg-black/5 relative transition-all group hover:bg-black/10" style={{height: activeMatch.xg_a ? `${activeMatch.xg_a * 40}%` : '4px'}}>
                                                <span className="absolute -top-10 left-0 mono text-2xl font-bold">{activeMatch.xg_a || '—'}</span>
                                                <div className="absolute bottom-[-32px] left-0 text-[10px] font-black uppercase tracking-wider">{activeMatch.away}</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col justify-center space-y-6">
                                        <div className="text-[10px] font-black uppercase tracking-widest text-ink/40">Model Reasoning</div>
                                        <h3 className="text-3xl serif italic leading-snug">
                                            {activeMatch.status === 'modeling' 
                                                ? '数据源握手与预处理' 
                                                : '物理压制 vs 市场偏见'}
                                        </h3>
                                        <p className="text-base leading-relaxed text-ink/60 serif font-medium">
                                            {activeMatch.status === 'modeling'
                                                ? '当前联赛（南美解放者杯）正在进行多源数据交叉验证，系统自动进入保守估计模式。'
                                                : `残差网络检测到本场比赛的“主场红利”被机构高估了 ${(activeMatch.edge * 10).toFixed(1)} 个基点。`}
                                        </p>
                                    </div>
                                </div>

                                {/* 3. Key Player Observation */}
                                {activeMatch.star && (
                                    <div className="bg-[#F9F7F2] p-16 rounded-sm border border-black/5 relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 p-8 opacity-[0.03] group-hover:scale-110 transition-transform duration-1000 select-none">
                                            <div className="text-[160px] serif italic font-black leading-none">KEY</div>
                                        </div>
                                        <div className="relative z-10 space-y-8">
                                            <div className="flex items-center gap-3">
                                                <div className="w-6 h-[1px] bg-accent"></div>
                                                <div className="text-[10px] font-black text-accent uppercase tracking-[0.3em]">Individual Intelligence</div>
                                            </div>
                                            <h2 className="text-5xl serif italic text-ink">{activeMatch.star.name}</h2>
                                            <div className="grid grid-cols-3 gap-12 pt-8">
                                                <div>
                                                    <div className="text-[9px] font-black opacity-30 uppercase mb-2 tracking-widest">xG Per 90</div>
                                                    <div className="text-3xl mono font-light">{activeMatch.star.xg}</div>
                                                </div>
                                                <div>
                                                    <div className="text-[9px] font-black opacity-30 uppercase mb-2 tracking-widest">SFC Impact</div>
                                                    <div className="text-3xl mono font-light">{activeMatch.star.sfc}</div>
                                                </div>
                                                <div>
                                                    <div className="text-[9px] font-black opacity-30 uppercase mb-2 tracking-widest">Victory Weight</div>
                                                    <div className="text-3xl mono font-bold text-accent">{activeMatch.star.impact}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 4. The Verdict */}
                                <div className="text-center pt-16 space-y-10">
                                    <div className="stamp text-5xl serif italic">
                                        {activeMatch.verdict}
                                    </div>
                                    <p className="max-w-md mx-auto text-[10px] leading-relaxed text-ink/40 uppercase tracking-[0.3em] font-bold">
                                        Algorithm PQ-V5.0: Stacking Residual Intelligence.<br/>
                                        First Principles Research Lab © 2026
                                    </p>
                                </div>

                                <div className="h-48"></div>
                            </div>
                        ) : (
                            <div className="flex h-full items-center justify-center opacity-20 serif italic text-4xl">
                                Select a research signal to begin...
                            </div>
                        )}
                        
                        {/* Vertical Decorative text */}
                        <div className="fixed bottom-16 right-12 text-[10px] font-black text-ink/10 uppercase tracking-[0.8em] origin-right rotate-90 select-none">
                            VARIABLE RESEARCH LAB
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
