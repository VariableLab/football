<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WC Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['SF Mono', 'Fira Code', 'JetBrains Mono', 'monospace'],
          },
          colors: {
            fg: '#111111',
            muted: '#6b7280',
            border: '#e5e7eb',
            green: '#16a34a',
            red: '#dc2626',
            blue: '#2563eb',
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    body { font-family: -apple-system, Inter, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-white text-fg antialiased overflow-hidden">

<div x-data="app" class="flex h-screen w-full">

  <!-- Sidebar: Match List -->
  <aside
    :class="mobileView === 'detail' ? '-ml-[100vw]' : 'ml-0'"
    class="fixed md:relative md:ml-0 w-[100vw] md:w-[340px] h-full border-r border-border flex flex-col bg-white shrink-0 transition-transform duration-200 ease-out z-30"
  >
    <!-- Header -->
    <div class="px-5 py-4 border-b border-border flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-fg flex items-center justify-center">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="white">
            <circle cx="7" cy="7" r="6" stroke="white" stroke-width="1.5" fill="none"/>
            <circle cx="7" cy="7" r="2" fill="white"/>
          </svg>
        </div>
        <div>
          <div class="text-sm font-semibold tracking-tight leading-tight">WC Analytics</div>
          <div class="text-[10px] text-muted leading-tight">Live Prediction Engine</div>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button @click="mobileView = 'list'" class="md:hidden p-1.5 hover:bg-gray-50 rounded-md text-muted">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="px-4 py-2.5 border-b border-border flex gap-1 shrink-0">
      <button
        @click="setFilter('today')"
        :class="filter === 'today' ? 'bg-fg text-white' : 'text-muted hover:text-fg hover:bg-gray-50'"
        class="flex-1 py-1.5 text-[11px] font-medium rounded-md transition-colors"
      >今日</button>
      <button
        @click="setFilter('tomorrow')"
        :class="filter === 'tomorrow' ? 'bg-fg text-white' : 'text-muted hover:text-fg hover:bg-gray-50'"
        class="flex-1 py-1.5 text-[11px] font-medium rounded-md transition-colors"
      >明日</button>
      <button
        @click="setFilter('upcoming')"
        :class="filter === 'upcoming' ? 'bg-fg text-white' : 'text-muted hover:text-fg hover:bg-gray-50'"
        class="flex-1 py-1.5 text-[11px] font-medium rounded-md transition-colors"
      >全部</button>
    </div>

    <!-- Match List -->
    <div class="flex-1 overflow-y-auto min-h-0">
      <template x-if="loading">
        <div class="flex flex-col items-center justify-center h-40 text-muted">
          <div class="w-5 h-5 border-2 border-fg border-t-transparent rounded-full animate-spin mb-2"></div>
          <span class="text-xs">加载中...</span>
        </div>
      </template>

      <template x-for="m in matches" :key="m.id">
        <div
          @click="selectMatch(m.id)"
          :class="selectedId === m.id ? 'bg-blue-50/60 border-l-[3px] border-blue-500' : 'border-l-[3px] border-transparent hover:bg-gray-50'"
          class="cursor-pointer px-4 py-3 border-b border-border transition-colors"
        >
          <!-- Competition + Time -->
          <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] font-medium text-muted" x-text="m.competition || ''"></span>
            <span class="text-[10px] font-mono text-muted" x-text="fmtBJ(m.kickoff_at)"></span>
          </div>

          <!-- Teams -->
          <div class="flex items-center justify-between">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate" x-text="m.home_team?.name"></div>
              <div class="text-sm font-medium truncate text-muted" x-text="m.away_team?.name"></div>
            </div>

            <!-- Edge badge -->
            <div class="ml-3 shrink-0">
              <template x-if="getEdge(m) !== null">
                <span :class="getEdge(m) > 0 ? 'text-green bg-green/10' : 'text-red bg-red/10'"
                      class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-mono font-semibold">
                  <span x-text="(getEdge(m) > 0 ? '+' : '') + (getEdge(m) * 100).toFixed(1) + '%'"></span>
                </span>
              </template>
              <template x-if="getEdge(m) === null">
                <span class="text-[11px] text-muted font-mono">—</span>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="!loading && matches.length === 0">
        <div class="flex flex-col items-center justify-center h-40 text-muted">
          <span class="text-sm">暂无比赛</span>
        </div>
      </template>
    </div>
  </aside>

  <!-- Main Content -->
  <main
    :class="mobileView === 'list' ? 'translate-x-[100vw]' : 'translate-x-0'"
    class="flex-1 h-full overflow-y-auto bg-white transition-transform duration-200 ease-out"
  >
    <!-- Mobile back button (only visible on small screens) -->
    <div class="md:hidden sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-border px-4 py-2.5 flex items-center gap-3">
      <button @click="mobileView = 'list'" class="p-1 -ml-1 text-muted hover:text-fg">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4L6 9l5 5"/></svg>
      </button>
      <span class="text-sm font-medium truncate" x-text="selectedMatch?.home_team?.name + ' vs ' + selectedMatch?.away_team?.name"></span>
    </div>

    <!-- Empty state -->
    <template x-if="!selectedId">
      <div class="h-full flex flex-col items-center justify-center text-muted select-none">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" class="mb-4 opacity-30">
          <rect x="8" y="8" width="32" height="32" rx="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M18 20h12M18 24h8M18 28h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="text-sm">选择一场比赛查看详情</span>
      </div>
    </template>

    <!-- Loading -->
    <template x-if="previewLoading || strategyLoading">
      <div class="h-full flex flex-col items-center justify-center text-muted">
        <div class="w-6 h-6 border-2 border-fg border-t-transparent rounded-full animate-spin mb-3"></div>
        <span class="text-sm" x-text="strategyLoading ? '计算策略...' : '加载数据...'"></span>
      </div>
    </template>

    <!-- Detail View -->
    <template x-if="selectedId && !previewLoading && !strategyLoading">
      <div class="max-w-4xl mx-auto px-6 py-8 md:px-12 md:py-12">

        <!-- Match Header -->
        <div class="mb-8">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-xs font-medium text-muted" x-text="selectedMatch?.competition || ''"></span>
            <span class="text-muted">·</span>
            <span class="text-xs font-mono text-muted" x-text="fmtBJ(selectedMatch?.kickoff_at)"></span>
            <span class="text-muted">·</span>
            <span class="text-xs text-muted" x-text="selectedMatch?.stage ? selectedMatch.stage.toUpperCase() : ''"></span>
          </div>
          <div class="flex items-center gap-4">
            <div class="flex-1">
              <div class="text-2xl md:text-3xl font-semibold tracking-tight" x-text="selectedMatch?.home_team?.name"></div>
              <div class="text-xs text-muted mt-0.5" x-text="'ELO: ' + (selectedMatch?.home_team?.elo || '—')"></div>
            </div>
            <div class="text-2xl font-light text-muted">vs</div>
            <div class="flex-1 text-right">
              <div class="text-2xl md:text-3xl font-semibold tracking-tight" x-text="selectedMatch?.away_team?.name"></div>
              <div class="text-xs text-muted mt-0.5" x-text="'ELO: ' + (selectedMatch?.away_team?.elo || '—')"></div>
            </div>
          </div>
        </div>

        <!-- Model Signals -->
        <template x-if="bigScoreWarning || upsetSignal">
          <div class="mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Big Score Warning -->
            <template x-if="bigScoreWarning">
              <div class="p-4 border border-orange-200 rounded-xl bg-orange-50/50">
                <div class="flex items-center gap-2 mb-2">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="7" stroke="#f97316" stroke-width="1.5"/>
                    <path d="M8 5v3.5M8 10.5v.5" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  <span class="text-xs font-semibold text-orange-700">大比分预警</span>
                </div>
                <div class="flex items-baseline gap-2">
                  <span class="text-2xl font-mono font-bold text-orange-600" x-text="(collapseProb * 100).toFixed(1) + '%'"></span>
                  <span class="text-xs text-muted">崩盘概率</span>
                </div>
                <div class="mt-2 text-xs text-orange-600/80">模型检测到实力悬殊信号，可能出现 4:0+ 的极端比分</div>
              </div>
            </template>

            <!-- Upset Signal -->
            <template x-if="upsetSignal">
              <div class="p-4 border border-purple-200 rounded-xl bg-purple-50/50">
                <div class="flex items-center gap-2 mb-2">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M8 2l6 4v4l-6 4-6-4V6z" stroke="#a855f7" stroke-width="1.5"/>
                    <path d="M8 8v4M8 6l3-2" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                  <span class="text-xs font-semibold text-purple-700">市场分歧</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <div class="text-[10px] text-muted uppercase">爆冷概率</div>
                    <div class="text-lg font-mono font-semibold text-purple-600" x-text="(upsetSignal.upset_probability * 100).toFixed(1) + '%'"></div>
                  </div>
                  <div>
                    <div class="text-[10px] text-muted uppercase">KL 散度</div>
                    <div class="text-lg font-mono font-semibold text-purple-600" x-text="upsetSignal.kl_divergence.toFixed(4)"></div>
                  </div>
                </div>
                <div class="mt-1 text-xs text-purple-600/80" x-text="upsetSignal.divergence_direction === 'model_home_favor' ? '模型看好主场' : upsetSignal.divergence_direction === 'model_away_favor' ? '模型看好客场' : '模型看好平局'"></div>
              </div>
            </template>
          </div>
        </template>

        <!-- Strategy Card -->
        <template x-if="selectedStrategy">
          <div class="mb-8 p-5 border border-border rounded-xl bg-gray-50/50">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-semibold">策略建议</h3>
              <div class="flex items-center gap-2">
                <select x-model="riskTier" @change="changeRiskTier()" class="text-xs border border-border rounded-md px-2 py-1 bg-white focus:outline-none focus:ring-1 focus:ring-gray-300">
                  <option value="conservative">稳健</option>
                  <option value="balanced">均衡</option>
                  <option value="aggressive">进取</option>
                  <option value="speculative">激进</option>
                </select>
                <div class="flex items-center gap-1 ml-2">
                  <span class="text-xs text-muted">Bankroll:</span>
                  <input type="number" x-model.number="bankroll" @input="recalcStake()" class="w-20 text-xs border border-border rounded-md px-2 py-1 bg-white focus:outline-none focus:ring-1 focus:ring-gray-300 font-mono" />
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
              <div>
                <div class="text-[10px] text-muted uppercase tracking-wider mb-1">Edge</div>
                <div class="text-xl font-mono font-semibold" :class="selectedStrategy.edge > 0 ? 'text-green' : 'text-muted'"
                     x-text="(selectedStrategy.edge * 100).toFixed(2) + '%'"></div>
              </div>
              <div>
                <div class="text-[10px] text-muted uppercase tracking-wider mb-1">EV</div>
                <div class="text-xl font-mono font-semibold" :class="selectedStrategy.ev > 0 ? 'text-green' : 'text-muted'"
                     x-text="selectedStrategy.ev.toFixed(3)"></div>
              </div>
              <div>
                <div class="text-[10px] text-muted uppercase tracking-wider mb-1">Kelly</div>
                <div class="text-xl font-mono font-semibold text-muted"
                     x-text="(selectedStrategy.kelly_fraction * 100).toFixed(1) + '%'"></div>
              </div>
              <div>
                <div class="text-[10px] text-muted uppercase tracking-wider mb-1">仓位</div>
                <div class="text-xl font-mono font-semibold text-blue"
                     x-text="(stakeAmount).toFixed(0) + ' (' + (selectedStrategy.stake_pct * 100).toFixed(1) + '%)'"></div>
              </div>
            </div>

            <div class="text-sm leading-relaxed text-muted">
              <span class="font-medium text-fg" x-text="selectedStrategy.rationale || ''"></span>
            </div>
          </div>
        </template>

        <!-- Hedged Portfolio -->
        <template x-if="portfolios.length > 0">
          <div class="mb-8">
            <h3 class="text-sm font-semibold mb-3">对冲投资组合</h3>
            <div class="space-y-3">
              <template x-for="(port, idx) in portfolios.slice(0, 3)" :key="idx">
                <div class="p-4 border border-border rounded-xl bg-gradient-to-r from-blue-50/30 to-transparent">
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-medium" x-text="port.name"></span>
                    <span class="text-xs font-mono px-2 py-0.5 rounded bg-green-100 text-green-700" x-text="'ROI ' + (port.expected_roi * 100).toFixed(1) + '%'"></span>
                  </div>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-2">
                    <template x-for="leg in port.legs" :key="leg.play + leg.selection">
                      <div>
                        <div class="text-[10px] text-muted uppercase" x-text="leg.type === 'primary' ? '主攻' : '对冲'"></div>
                        <div class="text-xs font-medium"><span x-text="leg.play"></span> <span x-text="leg.selection"></span></div>
                        <div class="text-xs font-mono text-muted">@<span x-text="leg.odds.toFixed(2)"></span></div>
                      </div>
                    </template>
                  </div>
                  <div class="text-xs text-muted leading-relaxed" x-text="port.rationale"></div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Probability Tables -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

          <!-- SPF -->
          <template x-if="spfPrediction">
            <div class="border border-border rounded-xl overflow-hidden">
              <div class="px-4 py-2.5 border-b border-border bg-gray-50/50">
                <span class="text-xs font-semibold text-muted">胜平负</span>
              </div>
              <table class="w-full text-sm">
                <tbody>
                  <template x-for="[k, v] in Object.entries(spfPrediction.probabilities).sort((a,b) => b[1] - a[1])" :key="k">
                    <tr class="border-b border-border/50 last:border-0">
                      <td class="px-4 py-2.5 text-muted" x-text="labelSPF(k)"></td>
                      <td class="px-4 py-2.5 text-right font-mono font-medium" x-text="(v * 100).toFixed(1) + '%'"></td>
                      <td class="px-4 py-2.5 w-24">
                        <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                          <div class="h-full rounded-full transition-all" :class="v > 0.45 ? 'bg-blue-500' : 'bg-gray-300'"
                               :style="'width:' + (v * 100) + '%'"></div>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <!-- RQ -->
          <template x-if="rqPrediction">
            <div class="border border-border rounded-xl overflow-hidden">
              <div class="px-4 py-2.5 border-b border-border bg-gray-50/50 flex items-center justify-between">
                <span class="text-xs font-semibold text-muted">让球胜平负</span>
                <span class="text-[10px] text-muted font-mono" x-text="'让 ' + (rqPrediction.probabilities.handicap || 0)"></span>
              </div>
              <table class="w-full text-sm">
                <tbody>
                  <template x-for="[k, v] in Object.entries(rqPrediction.probabilities).filter(([k]) => k !== 'handicap').sort((a,b) => b[1] - a[1])" :key="k">
                    <tr class="border-b border-border/50 last:border-0">
                      <td class="px-4 py-2.5 text-muted" x-text="labelRQ(k)"></td>
                      <td class="px-4 py-2.5 text-right font-mono font-medium" x-text="(v * 100).toFixed(1) + '%'"></td>
                      <td class="px-4 py-2.5 w-24">
                        <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                          <div class="h-full rounded-full transition-all" :class="v > 0.4 ? 'bg-blue-500' : 'bg-gray-300'"
                               :style="'width:' + (v * 100) + '%'"></div>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <!-- Score -->
          <template x-if="scorePrediction">
            <div class="border border-border rounded-xl overflow-hidden">
              <div class="px-4 py-2.5 border-b border-border bg-gray-50/50">
                <span class="text-xs font-semibold text-muted">比分预测 (Top 5)</span>
              </div>
              <div class="p-3">
                <template x-for="[score, prob] in Object.entries(scorePrediction.probabilities).sort((a,b) => b[1] - a[1]).slice(0, 5)" :key="score">
                  <div class="flex items-center justify-between py-1.5 border-b border-border/30 last:border-0">
                    <span class="font-mono text-sm font-medium" x-text="score"></span>
                    <div class="flex items-center gap-3 flex-1 justify-end">
                      <div class="w-20 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full rounded-full bg-gray-400" :style="'width:' + (prob * 100) + '%'"></div>
                      </div>
                      <span class="font-mono text-xs text-muted w-12 text-right" x-text="(prob * 100).toFixed(1) + '%'"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Goals -->
          <template x-if="goalsPrediction">
            <div class="border border-border rounded-xl overflow-hidden">
              <div class="px-4 py-2.5 border-b border-border bg-gray-50/50">
                <span class="text-xs font-semibold text-muted">总进球分布</span>
              </div>
              <div class="p-3">
                <template x-for="[goals, prob] in Object.entries(goalsPrediction.probabilities).sort((a,b) => parseInt(a[0]) - parseInt(b[0]))" :key="goals">
                  <div class="flex items-center justify-between py-1.5 border-b border-border/30 last:border-0">
                    <span class="font-mono text-sm font-medium" x-text="goals + ' 球'"></span>
                    <div class="flex items-center gap-3 flex-1 justify-end">
                      <div class="w-20 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full rounded-full bg-gray-400" :style="'width:' + (prob * 100) + '%'"></div>
                      </div>
                      <span class="font-mono text-xs text-muted w-12 text-right" x-text="(prob * 100).toFixed(1) + '%'"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Half/Full -->
          <template x-if="halfPrediction">
            <div class="border border-border rounded-xl overflow-hidden md:col-span-2">
              <div class="px-4 py-2.5 border-b border-border bg-gray-50/50">
                <span class="text-xs font-semibold text-muted">半全场预测 (Top 3)</span>
              </div>
              <div class="p-3">
                <template x-for="[half, prob] in Object.entries(halfPrediction.probabilities).sort((a,b) => b[1] - a[1]).slice(0, 3)" :key="half">
                  <div class="flex items-center justify-between py-1.5 border-b border-border/30 last:border-0">
                    <span class="font-mono text-sm font-medium" x-text="half"></span>
                    <div class="flex items-center gap-3 flex-1 justify-end">
                      <div class="w-20 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full rounded-full bg-gray-400" :style="'width:' + (prob * 100) + '%'"></div>
                      </div>
                      <span class="font-mono text-xs text-muted w-12 text-right" x-text="(prob * 100).toFixed(1) + '%'"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Model Info Footer -->
        <div class="flex items-center justify-between text-[10px] text-muted border-t border-border pt-4">
          <span x-text="'Model: ' + (selectedStrategy ? (predictions.find(p => p.play_type === 'SPF')?.model_version || 'v3.0_mixture') : 'v3.0_mixture')"></span>
          <span x-text="'Odds Source: ' + (selectedMatch?.odds_source || '—')"></span>
          <template x-if="collapseProb > 0.15">
            <span class="text-orange-500 font-medium" x-text="'Collapse: ' + (collapseProb * 100).toFixed(1) + '%'"></span>
          </template>
          <span x-text="'Confidence: ' + (selectedMatch?.confidence || '—')"></span>
        </div>
      </div>
    </template>
  </main>
</div>

<!-- Scripts -->
<script src="/static/api_client.js?v=20260621-redesign"></script>
<script src="/static/i18n.js?v=20260621-redesign"></script>
<script src="/static/app.js?v=20260621-redesign"></script>
<script defer src="/static/vendor/alpine.min.js"></script>

</body>
</html>
