<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Vault Seek - Future Minimalism Redesign</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0A0C;
      --accent-cyan: #00F2FF;
      --accent-violet: #8B5CF6;
      --ink: #FFFFFF;
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(255, 255, 255, 0.02);
    }
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* B-Reel Hud Textures */
    .hud-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px) saturate(150%);
      border: 1px solid var(--glass-border);
      transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: var(--accent-cyan);
      background: rgba(0, 242, 255, 0.04);
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 242, 255, 0.1);
    }

    .search-glow {
      box-shadow: 0 0 30px rgba(0, 242, 255, 0.05);
      border-bottom: 2px solid var(--accent-cyan);
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .scanline {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      opacity: 0.1;
      animation: scanline 8s linear infinite;
    }

    /* 3D Tactile Corner */
    .corner-mark {
      position: absolute;
      width: 8px;
      height: 8px;
      border: 1px solid var(--accent-cyan);
    }
  </style>
</head>
<body>
  <div class="hud-grid"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Header = () => (
      <nav className="fixed top-0 left-0 right-0 z-50 px-10 py-6 flex justify-between items-center border-b border-white/5 bg-black/40 backdrop-blur-md">
        <div className="flex items-center gap-4 group cursor-pointer">
          <div className="w-10 h-10 border border-accent-cyan flex items-center justify-center relative">
             <div className="corner-mark -top-1 -left-1"></div>
             <span className="font-mono text-xs font-bold text-accent-cyan">VS</span>
          </div>
          <span className="font-black tracking-[0.3em] text-sm uppercase">Vault Seek</span>
        </div>
        <div className="hidden md:flex gap-10">
          {['Vault', 'Tools', 'Community', 'Docs'].map(item => (
            <a key={item} className="text-[10px] font-black uppercase tracking-widest text-white/40 hover:text-accent-cyan transition-colors">{item}</a>
          ))}
        </div>
        <button className="px-6 py-2 border border-white/10 rounded-sm text-[10px] font-black uppercase tracking-widest hover:bg-white/5 transition-all">
          Connect Identity
        </button>
      </nav>
    );

    const SectorTag = ({ label, active }) => (
      <button className={`px-4 py-1 rounded-full text-[9px] font-black uppercase tracking-widest border transition-all ${active ? 'bg-accent-cyan text-black border-accent-cyan' : 'border-white/10 text-white/40 hover:border-white/40'}`}>
        {label}
      </button>
    );

    const ResourceCard = ({ title, category, description, tools }) => (
      <div className="glass-card p-6 relative group flex flex-col h-full overflow-hidden">
        <div className="scanline"></div>
        <div className="flex justify-between items-start mb-6">
          <span className="text-[9px] font-mono text-accent-cyan/60" x-text="category.toUpperCase()">{category.toUpperCase()}</span>
          <div className="flex gap-1">
             <div className="w-1 h-1 rounded-full bg-accent-cyan shadow-[0_0_5px_var(--accent-cyan)]"></div>
             <div className="w-1 h-1 rounded-full bg-white/20"></div>
          </div>
        </div>
        <h3 className="text-xl font-bold mb-4 group-hover:text-accent-cyan transition-colors">{title}</h3>
        <p className="text-sm text-white/50 leading-relaxed mb-8 flex-1">{description}</p>
        <div className="flex flex-wrap gap-2 mt-auto">
          {tools.map(t => (
            <span key={t} className="text-[8px] font-mono px-2 py-0.5 bg-white/5 border border-white/5 rounded-sm">{t}</span>
          ))}
        </div>
      </div>
    );

    const App = () => {
      const resources = [
        { title: "Vector Search Interface", category: "AI Infrastructure", description: "高性能向量检索接口原型，支持千万级高维特征向量的秒级检索与排序。核心采用 HNSW 算法实现。", tools: ["Rust", "PyTorch", "Redis"] },
        { title: "Distributed Vault Engine", category: "Storage", description: "为开发者设计的分布式冷热数据隔离引擎，确保技术资产在极高可用性下的极致安全性。内置多重加密逻辑。", tools: ["Go", "gRPC", "K8s"] },
        { title: "Quantum Frontend Kit", category: "UX Framework", description: "极致性能的前端交互套件，内置微秒级状态同步引擎。专为高频交易与数据监测界面设计。", tools: ["React", "Wasm", "Tailwind"] },
        { title: "Semantic Knowledge Hub", category: "NLP Pipeline", description: "全自动技术文档语义化处理管道。支持将 Markdown/Code 自动切片并注入知识图谱。", tools: ["Python", "OpenAI", "LangChain"] }
      ];

      return (
        <div className="min-h-screen pt-40 pb-40 px-6 sm:px-10">
          <Header />
          
          <div className="max-w-6xl mx-auto">
            {/* Hero & Search */}
            <div className="text-center mb-32 relative">
               <div className="absolute -top-20 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-accent-cyan/5 blur-[120px] rounded-full -z-10"></div>
               <h1 className="text-5xl sm:text-7xl font-black uppercase tracking-tighter mb-8 italic">
                 Seek the <span className="text-accent-cyan">Digital Truth.</span>
               </h1>
               <p className="text-white/40 text-sm font-mono tracking-widest mb-12 uppercase">Advanced Resource Discovery & Knowledge Vault</p>
               
               <div className="max-w-2xl mx-auto relative group">
                  <input 
                    type="text" 
                    placeholder="INITIATE VECTOR SEARCH..."
                    className="w-full bg-white/5 border border-white/10 p-6 font-mono text-sm tracking-widest focus:outline-none focus:border-accent-cyan transition-all search-glow"
                  />
                  <div className="absolute right-6 top-1/2 -translate-y-1/2 text-accent-cyan font-mono text-xs opacity-50">CMD + K</div>
               </div>
            </div>

            {/* Filtering Sectors */}
            <div className="flex flex-wrap justify-center gap-4 mb-20">
               {['All Sectors', 'AI & ML', 'Core Engine', 'Frontend', 'Infrastructure', 'Security'].map((tag, i) => (
                 <SectorTag key={tag} label={tag} active={i === 0} />
               ))}
            </div>

            {/* Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
              {resources.map((r, idx) => (
                <ResourceCard key={idx} {...r} />
              ))}
            </div>
            
            {/* Structural Divider */}
            <div className="mt-40 pt-10 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-8">
               <div className="flex items-center gap-4">
                  <div className="text-[10px] font-mono opacity-20">0xFF-SYSTEM_ACTIVE</div>
                  <div className="w-32 h-px bg-white/5"></div>
                  <div className="text-[10px] font-mono text-accent-cyan animate-pulse">UPTIME: 99.99%</div>
               </div>
               <div className="text-[9px] font-black uppercase tracking-[0.4em] text-white/20">End of Sector // Logic.v2.0</div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
