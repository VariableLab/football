<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #020408;
            --gold: #FFD60A;
            --blue: #00D4FF;
        }
        body {
            width: 960pt; height: 540pt;
            background-color: var(--bg-deep);
            color: white;
            font-family: 'PingFang SC', sans-serif;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cta-container { text-align: center; border: 2px solid var(--blue); padding: 60pt; border-radius: 16pt; background: rgba(0,212,255,0.03); box-shadow: 0 0 50pt rgba(0,212,255,0.1); }
        h1 { font-size: 48pt; font-weight: 900; margin-bottom: 20pt; line-height: 1.2; }
        .gold { color: var(--gold); }
        .blue { color: var(--blue); }
        p { font-size: 20pt; color: rgba(255,255,255,0.6); margin-bottom: 40pt; }
        .button { display: inline-block; background: var(--blue); color: black; padding: 15pt 40pt; border-radius: 30pt; font-size: 18pt; font-weight: 900; text-transform: uppercase; letter-spacing: 2pt; text-decoration: none; box-shadow: 0 0 20pt var(--blue); }
        .lang-switch { position: absolute; top: 40pt; right: 60pt; border: 1px solid var(--blue); padding: 5pt 10pt; color: var(--blue); cursor: pointer; font-size: 10pt; font-weight: 900; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const CTA = () => {
            const [lang, setLang] = React.useState('zh');
            const t = {
                zh: {
                    line1: "赢在 2026",
                    line2: "定义赛事智慧",
                    desc: "诚邀您加入，共同收割世界杯万亿流量红利",
                    btn: "开启商业合作"
                },
                en: {
                    line1: "WIN IN 2026",
                    line2: "DEFINE INTELLIGENCE",
                    desc: "Join us in capturing the trillion-dollar World Cup traffic dividend.",
                    btn: "CONTACT FOR PARTNERSHIP"
                }
            }[lang];

            return (
                <div style={{width: '100%', height: '100%', display: 'flex', justifyContent: 'center', alignItems: 'center'}}>
                    <div className="lang-switch" onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}>
                        {lang === 'zh' ? 'EN' : '中'}
                    </div>
                    <div className="cta-container">
                        <h1><span className="gold">{t.line1}</span><br/><span className="blue">{t.line2}</span></h1>
                        <p>{t.desc}</p>
                        <div className="button">{t.btn}</div>
                        <div style={{marginTop: '30pt', fontSize: '12pt', color: '#444', fontFamily: 'Montserrat'}}>
                            FOOTBALL.NETT.TO | WC-ANALYTICS LAB
                        </div>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<CTA />);
    </script>
</body>
</html>
