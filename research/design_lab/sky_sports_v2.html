<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Prototype - F1 Fusion Series</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto+Mono:wght@500&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020408;
            --card-border-gold: #FFD60A; /* 黄 */
            --accent-purple: #BF5AF2;    /* 紫 */
            --accent-green: #32D74B;     /* 绿 */
            --accent-blue: #00D4FF;
            --glass-bg: rgba(10, 15, 28, 0.9);
        }
        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Roboto Condensed', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(191, 86, 242, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(50, 215, 75, 0.05) 0%, transparent 40%);
        }
        #root {
            width: 1200px;
            height: 850px;
            position: relative;
            /* 强化分离感：多层大范围阴影 */
            box-shadow: 
                0 50px 100px -20px rgba(0,0,0,0.9),
                0 30px 60px -30px rgba(0,0,0,1),
                0 0 40px rgba(0,212,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 2px solid rgba(255,255,255,0.05);
        }
        /* 顶部黄色激光切割线 */
        .cut-line-top {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--card-border-gold), transparent);
            box-shadow: 0 0 15px var(--card-border-gold);
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="cut-line-top"></div>
    </div>

    <script type="text/babel">
        const { useState } = React;

        const F1FusionCard = () => {
            return (
                <div style={{ padding: '50px', height: '100%', boxSizing: 'border-box', display: 'flex', flexDirection: 'column' }}>
                    
                    {/* SECTION 1: HEADER (YELLOW THEME) */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid rgba(255,214,10,0.2)', paddingBottom: '20px' }}>
                        <div>
                            <div style={{ color: 'var(--card-border-gold)', letterSpacing: '6px', fontSize: '12px', fontWeight: '900' }}>
                                CORE INTELLIGENCE NODE
                            </div>
                            <div style={{ fontFamily: 'Montserrat', fontSize: '56px', fontWeight: '900', color: 'white', marginTop: '10px' }}>
                                F1 <span style={{ color: 'var(--card-border-gold)' }}>RESEARCH</span> EDITION
                            </div>
                        </div>
                        <div style={{ textAlign: 'right', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
                            <div style={{ fontFamily: 'Roboto Mono', color: 'var(--card-border-gold)', fontSize: '14px' }}>SESSION: 2026.WC.LAB</div>
                            <div style={{ fontSize: '24px', fontWeight: '900' }}>STATUS: <span style={{ color: 'var(--accent-green)' }}>OPTIMIZED</span></div>
                        </div>
                    </div>

                    {/* MAIN CONTENT: THE CUT (PURPLE VS GREEN) */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '60px', flex: 1, marginTop: '40px' }}>
                        
                        {/* LEFT: THE AGGRESSOR (PURPLE) */}
                        <div style={{ position: 'relative', borderLeft: '4px solid var(--accent-purple)', paddingLeft: '30px' }}>
                            <div style={{ color: 'var(--accent-purple)', fontSize: '14px', fontWeight: '900', letterSpacing: '2px' }}>TACTICAL THREAT MAP</div>
                            <div style={{ fontSize: '32px', fontWeight: '900', margin: '15px 0' }}>PORTUGAL <span style={{fontSize: '16px', color: '#6B7280'}}>vs COLOMBIA</span></div>
                            
                            <div style={{ 
                                height: '350px', 
                                background: 'linear-gradient(135deg, rgba(191,86,242,0.1) 0%, transparent 100%)',
                                borderRadius: '8px',
                                border: '1px solid rgba(191,86,242,0.2)',
                                position: 'relative',
                                overflow: 'hidden'
                            }}>
                                {/* Pitch SVG */}
                                <svg viewBox="0 0 100 120" style={{ width: '100%', height: '100%', opacity: 0.2 }}>
                                    <rect x="0" y="0" width="100" height="120" fill="none" stroke="white" strokeWidth="0.5" />
                                    <line x1="0" y1="60" x2="100" y2="60" stroke="white" strokeWidth="0.5" />
                                    <circle cx="50" cy="60" r="10" fill="none" stroke="white" strokeWidth="0.5" />
                                </svg>
                                
                                {/* Danger Zone (Laser Cut Circle) */}
                                <div style={{ 
                                    position: 'absolute', top: '10%', left: '20%', width: '60%', height: '30%',
                                    border: '2px dashed var(--accent-purple)',
                                    borderRadius: '50%',
                                    background: 'rgba(191,86,242,0.1)',
                                    boxShadow: '0 0 30px rgba(191,86,242,0.3)',
                                    display: 'flex', justifyContent: 'center', alignItems: 'center'
                                }}>
                                    <span style={{ color: 'var(--accent-purple)', fontSize: '12px', fontWeight: 'bold' }}>EXPLOIT SECTOR 01</span>
                                </div>

                                {/* Movement Arrows */}
                                <svg style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%' }}>
                                    <path d="M 20 100 L 20 40 L 35 25" fill="none" stroke="var(--accent-purple)" strokeWidth="3" markerEnd="url(#arrow)" />
                                    <path d="M 80 100 L 80 40 L 65 25" fill="none" stroke="var(--accent-purple)" strokeWidth="3" />
                                </svg>
                            </div>
                        </div>

                        {/* RIGHT: THE OUTCOME (GREEN) */}
                        <div style={{ position: 'relative', borderLeft: '4px solid var(--accent-green)', paddingLeft: '30px' }}>
                            <div style={{ color: 'var(--accent-green)', fontSize: '14px', fontWeight: '900', letterSpacing: '2px' }}>PROBABILITY ENGINE</div>
                            <div style={{ fontSize: '32px', fontWeight: '900', margin: '15px 0' }}>F1 PREDICTION <span style={{fontSize: '16px', color: '#6B7280'}}>RPS: 0.199</span></div>
                            
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                {/* Main Prob Bar */}
                                <div style={{ background: 'rgba(50,215,75,0.05)', padding: '24px', borderRadius: '8px', border: '1px solid rgba(50,215,75,0.1)' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '10px' }}>
                                        <span style={{ fontWeight: 'bold' }}>PRIMARY OUTCOME (POR WIN)</span>
                                        <span style={{ color: 'var(--accent-green)', fontWeight: 'bold' }}>HIGH CONFIDENCE</span>
                                    </div>
                                    <div style={{ height: '50px', background: 'rgba(255,255,255,0.05)', borderRadius: '4px', overflow: 'hidden', position: 'relative' }}>
                                        <div style={{ width: '45%', height: '100%', background: 'linear-gradient(90deg, #1A4721, var(--accent-green))', boxShadow: '0 0 20px rgba(50,215,75,0.4)' }}></div>
                                        <div style={{ position: 'absolute', top: 0, left: '15px', height: '100%', display: 'flex', alignItems: 'center', fontSize: '24px', fontWeight: '900' }}>45%</div>
                                    </div>
                                </div>

                                {/* Secondary HUD Stats */}
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
                                    {[
                                        { label: 'ATTACK PWR', val: '88%', color: 'var(--accent-green)' },
                                        { label: 'DEFENSE STAB', val: '72%', color: 'var(--card-border-gold)' },
                                        { label: 'XG EXPECTED', val: '1.82', color: 'white' },
                                        { label: 'MATCH RANK', val: '#04', color: 'var(--accent-purple)' },
                                    ].map((stat, idx) => (
                                        <div key={idx} style={{ background: 'rgba(255,255,255,0.03)', padding: '15px', borderRadius: '4px', border: '1px solid rgba(255,255,255,0.05)' }}>
                                            <div style={{ fontSize: '10px', color: '#6B7280', fontWeight: 'bold' }}>{stat.label}</div>
                                            <div style={{ fontSize: '20px', fontWeight: '900', color: stat.color, marginTop: '5px' }}>{stat.val}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* SECTION 3: FOOTER (MULTI-COLOR CUT) */}
                    <div style={{ marginTop: 'auto', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
                        <div style={{ display: 'flex', gap: '20px' }}>
                             <div style={{ padding: '10px 20px', background: 'var(--accent-purple)', borderRadius: '2px', fontSize: '12px', fontWeight: '900', color: 'black' }}>STRATEGY: VERTICAL</div>
                             <div style={{ padding: '10px 20px', border: '1px solid var(--accent-green)', color: 'var(--accent-green)', borderRadius: '2px', fontSize: '12px', fontWeight: '900' }}>EV: +12.4%</div>
                        </div>
                        <div style={{ textAlign: 'right' }}>
                            <div style={{ fontSize: '10px', color: '#6B7280' }}>POWERED BY</div>
                            <div style={{ fontSize: '18px', fontWeight: '900' }}>WC-ANALYTICS <span style={{color: 'var(--card-border-gold)'}}>F1-LAB</span></div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<F1FusionCard />);
    </script>
</body>
</html>
